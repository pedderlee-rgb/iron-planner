<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151515"><link rel="manifest" href="manifest.webmanifest"><title>Iron Planner</title><style>:root{--bg:#101112;--card:#1b1d1f;--card2:#25282b;--text:#f2f3f4;--muted:#a7adb3;--accent:#ff5a4f;--line:#363a3e;--warn:#f1c75b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}.app{max-width:900px;margin:auto;padding-bottom:80px}header{position:sticky;top:0;z-index:4;background:#101112ee;border-bottom:1px solid var(--line);padding:13px 15px;display:flex;justify-content:space-between}h1{font-size:18px;margin:0}main{padding:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}h2,h3{margin:0 0 10px}.muted,.tiny{color:var(--muted)}.tiny{font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}label{display:block;color:var(--muted);font-size:12px;margin:8px 0 4px}input,select,textarea,button{font:inherit;border-radius:9px}input,select,textarea{width:100%;padding:9px;background:#111315;color:var(--text);border:1px solid var(--line)}button{padding:10px 12px;border:0;background:var(--accent);color:white;font-weight:700}button.secondary{background:var(--card2)}button.danger{background:#7c2723}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.actions button{flex:1;min-width:130px}.set{display:grid;grid-template-columns:35px 1fr 1fr 35px;gap:7px;align-items:center;margin:6px 0}.set span{text-align:center;color:var(--muted)}nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;background:#090a0b;border-top:1px solid var(--line)}nav button{flex:1;background:none;color:var(--muted);border-radius:0;font-size:12px}nav button.on{background:#1c1e20;color:white}.badge{display:inline-block;padding:3px 7px;border-radius:99px;background:#303438;color:var(--muted);font-size:11px;margin-right:4px}.override{background:var(--warn);color:#111}.modal{position:fixed;inset:0;background:#000b;z-index:10;display:none;align-items:end}.modal.open{display:flex}.box{background:var(--card);width:min(900px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}table{width:100%;border-collapse:collapse}td,th{padding:7px 5px;border-bottom:1px solid var(--line);text-align:left}@media(min-width:700px){nav{position:sticky;top:0;bottom:auto}nav button{border:1px solid var(--line);margin:5px;border-radius:9px}}</style></head><body><div class="app"><header><h1>IRON PLANNER</h1><span id="pill" class="tiny"></span></header><main><section id="today"></section><section id="forecast" hidden></section><section id="program" hidden></section><section id="history" hidden></section><section id="settings" hidden></section></main><nav><button data-v="today" class="on">Today</button><button data-v="forecast">Forecast</button><button data-v="program">Programme</button><button data-v="history">History</button><button data-v="settings">Settings</button></nav></div><div id="modal" class="modal"><div id="box" class="box"></div></div><script>const K='ironPlannerV2',uid=()=>Math.random().toString(36).slice(2,9),R=(n,r=2.5)=>Math.round(n/r)*r,esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));let db=JSON.parse(localStorage.getItem(K)||'null')||{name:'My Strength Programme',session:0,round:2.5,days:[{name:'Day 1',ex:[{id:uid(),name:'Squat',base:100,tm:100,type:'531',inc:5}]}],history:[],edits:{}};function save(){localStorage.setItem(K,JSON.stringify(db))}function key(i,id){return i+':'+id}function day(i){return db.days[i%db.days.length]}function calc(ex,n){let p=ex.type||'fixed',w=+ex.base||0,sets=3,reps=5,label='Custom',arr=null;if(p==='fixed'){w=+ex.weight||w;label='Fixed'}else if(p==='linear'){w+= (+ex.inc||0)*n;sets=ex.sets||3;reps=ex.reps||5;label='Linear'}else if(p==='ss'){w+=(+ex.inc||0)*n;sets=ex.sets||3;reps=ex.stage||5;label='Starting Strength'}else if(p==='531'){let c=Math.floor(n/4),week=n%4+1,tm=(+ex.tm||w)+(+ex.inc||0)*c,pct=week===1?[.65,.75,.85]:week===2?[.7,.8,.9]:week===3?[.75,.85,.95]:[.4,.5,.6],rr=week===1?[5,5,5]:week===2?[3,3,3]:week===3?[5,3,1]:[5,5,5];arr=pct.map(x=>R(tm*x,db.round));reps=rr;sets=3;label=`5/3/1 W${week}`}else if(p==='texas'){let c=Math.floor(n/3),s=n%3,f=[ex.vol||.9,ex.rec||.8,ex.int||1];w=(+ex.tm||w)*f[s]+(+ex.inc||0)*c;sets=s===0?5:s===1?3:1;reps=s===2?(ex.topReps||5):(ex.reps||5);label=['Texas Volume','Texas Recovery','Texas Intensity'][s]}else if(p==='hlm'){let c=Math.floor(n/3),s=n%3,f=[ex.heavy||1,ex.light||.8,ex.medium||.9];w=(+ex.tm||w)*f[s]+(+ex.inc||0)*c;sets=ex.sets||3;reps=ex.reps||5;label=['Heavy','Light','Medium'][s]}else if(p==='top'){w+=(+ex.inc||0)*n;sets=1;reps=ex.reps||5;label=`Top set ${reps}+`}if(!arr)w=R(w,db.round);return{weight:arr||w,sets,reps,label}}function plan(n){let d=day(n);return d.ex.map(e=>{let x=calc(e,n),o=db.edits[key(n,e.id)];return{...x,e,override:!!o,...(o||{})}})}function setsFor(x){if(Array.isArray(x.weight))return x.weight.map((w,i)=>({w,r:Array.isArray(x.reps)?x.reps[i]:5}));return Array.from({length:x.sets},()=>({w:x.weight,r:x.reps}))}function renderToday(){let p=plan(db.session),h=`<div class="row"><div><h2>${esc(day(db.session).name)}</h2><div class="muted">Session ${db.session+1}</div></div><button class="secondary" onclick="edit(${db.session})">Edit prescriptions</button></div>`;p.forEach((x,i)=>{h+=`<div class="card"><div class="row"><h3>${esc(x.e.name)}</h3><span class="badge ${x.override?'override':''}">${esc(x.override?'Override':x.label)}</span></div><div class="muted">Planned: ${Array.isArray(x.weight)?x.weight.map((w,j)=>w+'×'+x.reps[j]).join(' · '):x.weight+' kg × '+x.reps+' × '+x.sets}</div>`;setsFor(x).forEach((s,j)=>h+=`<div class="set"><span>${j+1}</span><input id="w${i}_${j}" type="number" value="${s.w}"><input id="r${i}_${j}" type="number" value="${s.r}"><input id="c${i}_${j}" type="checkbox"></div>`);h+=`<textarea id="n${i}" placeholder="Notes"></textarea></div>`});h+=`<div class="actions"><button onclick="log()">Log workout & continue</button></div>`;document.querySelector('#today').innerHTML=h;document.querySelector('#pill').textContent=`${db.name} · ${db.session+1}`}function renderForecast(){let h='<h2>Next 20 sessions</h2><p class="muted">Forecast is generated from the programme. Actual logged results never rewrite the plan.</p><table><tr><th>#</th><th>Day</th><th>Exercise</th><th>Prescription</th></tr>';for(let n=db.session;n<db.session+20;n++)plan(n).forEach(x=>h+=`<tr><td>${n+1}</td><td>${esc(day(n).name)}</td><td>${esc(x.e.name)}</td><td>${Array.isArray(x.weight)?x.weight.map((w,j)=>w+'×'+x.reps[j]).join(' · '):x.weight+'×'+x.reps+' × '+x.sets}${x.override?' <span class="badge override">override</span>':''}</td></tr>`);document.querySelector('#forecast').innerHTML=h+'</table>'}function params(e){return e.type==='531'?`<div class="grid"><div><label>TM</label><input id="tm-${e.id}" type="number" value="${e.tm??e.base}"></div><div><label>TM increase / 4-week cycle</label><input id="inc-${e.id}" type="number" value="${e.inc??0}"></div></div>`:`<div class="grid"><div><label>Increment</label><input id="inc-${e.id}" type="number" value="${e.inc??0}"></div><div><label>Sets</label><input id="sets-${e.id}" type="number" value="${e.sets??3}"></div><div><label>Reps</label><input id="reps-${e.id}" type="number" value="${e.reps??5}"></div></div>`}function renderProgram(){let h=`<div class="row"><div><h2>Programme</h2><input id="pname" value="${esc(db.name)}"></div><button onclick="saveName()">Save</button></div><div class="card"><label>Number of lifting days (1–14)</label><input id="ndays" type="number" min="1" max="14" value="${db.days.length}"><button style="margin-top:8px" onclick="resize()">Apply</button><div class="actions"><button class="secondary" onclick="preset('531')">Load 5/3/1</button><button class="secondary" onclick="preset('ss')">Load Starting Strength</button><button class="secondary" onclick="preset('texas')">Load Texas Method</button><button class="secondary" onclick="preset('hlm')">Load HLM</button></div></div>`;db.days.forEach((d,di)=>{h+=`<div class="card"><div class="row"><h3>Day ${di+1}: <input id="dn${di}" value="${esc(d.name)}"></h3><button class="danger" onclick="removeDay(${di})">Remove day</button></div>`;d.ex.forEach(e=>{h+=`<div class="card"><div class="row"><input id="en-${e.id}" value="${esc(e.name)}"><button class="danger" onclick="removeEx(${di},'${e.id}')">Remove</button></div><div class="grid3"><div><label>Base weight</label><input id="base-${e.id}" type="number" value="${e.base}"></div><div><label>Training Max</label><input id="tm-${e.id}" type="number" value="${e.tm??e.base}"></div><div><label>Progression</label><select id="type-${e.id}" onchange="renderProgram()"><option value="fixed" ${e.type==='fixed'?'selected':''}>Fixed</option><option value="linear" ${e.type==='linear'?'selected':''}>Linear</option><option value="ss" ${e.type==='ss'?'selected':''}>Starting Strength</option><option value="531" ${e.type==='531'?'selected':''}>5/3/1</option><option value="texas" ${e.type==='texas'?'selected':''}>Texas Method</option><option value="hlm" ${e.type==='hlm'?'selected':''}>HLM</option><option value="top" ${e.type==='top'?'selected':''}>Top set (+)</option></select></div></div>${params({...e,type:document.getElementById('type-'+e.id)?.value||e.type})}<button style="margin-top:8px" onclick="saveEx(${di},'${e.id}')">Save lift</button></div>`});h+=`<button class="secondary" onclick="addEx(${di})">+ Add exercise</button></div>`});document.querySelector('#program').innerHTML=h}function saveName(){db.name=document.getElementById('pname').value||'My Strength Programme';db.days.forEach((d,i)=>d.name=document.getElementById('dn'+i)?.value||d.name);save();renderAll()}function resize(){let n=Math.max(1,Math.min(14,+document.getElementById('ndays').value||1));while(db.days.length<n)db.days.push({name:'Day '+(db.days.length+1),ex:[]});db.days.length=n;save();renderAll()}function addEx(i){db.days[i].ex.push({id:uid(),name:'New Exercise',base:0,tm:0,type:'fixed',weight:0,sets:3,reps:5,inc:0});save();renderAll()}function removeEx(i,id){db.days[i].ex=db.days[i].ex.filter(e=>e.id!==id);save();renderAll()}function removeDay(i){if(db.days.length===1)return;db.days.splice(i,1);save();renderAll()}function saveEx(di,id){let e=db.days[di].ex.find(x=>x.id===id),t=document.getElementById('type-'+id).value;e.name=document.getElementById('en-'+id).value;e.base=+document.getElementById('base-'+id).value||0;e.tm=+document.getElementById('tm-'+id).value||e.base;e.type=t;e.inc=+document.getElementById('inc-'+id)?.value||0;e.sets=+document.getElementById('sets-'+id)?.value||3;e.reps=+document.getElementById('reps-'+id)?.value||5;save();renderAll()}function edit(n){let p=plan(n),h=`<div class="row"><h2>Edit session ${n+1}</h2><button class="secondary" onclick="closeM()">Close</button></div><p class="muted">These are session-only overrides. They do not alter Training Max, progression, or later sessions.</p>`;p.forEach(x=>h+=`<div class="card"><h3>${esc(x.e.name)}</h3><label>Weight(s), comma separated</label><input id="ow-${x.e.id}" value="${Array.isArray(x.weight)?x.weight.join(','):x.weight}"><div class="grid"><div><label>Sets</label><input id="os-${x.e.id}" type="number" value="${x.sets}"></div><div><label>Reps (comma separated for 5/3/1)</label><input id="or-${x.e.id}" value="${Array.isArray(x.reps)?x.reps.join(','):x.reps}"></div></div></div>`);h+=`<button onclick="saveEdit(${n})">Save session overrides</button>`;document.getElementById('box').innerHTML=h;document.getElementById('modal').classList.add('open')}function saveEdit(n){plan(n).forEach(x=>{let w=document.getElementById('ow-'+x.e.id).value.split(',').map(Number),r0=document.getElementById('or-'+x.e.id).value,r=r0.includes(',')?r0.split(',').map(Number):+r0;db.edits[key(n,x.e.id)]={weight:Array.isArray(x.weight)?w:w[0],sets:+document.getElementById('os-'+x.e.id).value,reps:r,label:'Manual override'}});save();closeM();renderAll()}function log(){let p=plan(db.session),lifts=p.map((x,i)=>({name:x.e.name,planned:x.weight,sets:setsFor(x).map((s,j)=>({plannedWeight:s.w,plannedReps:s.r,actualWeight:+document.getElementById(`w${i}_${j}`).value||0,actualReps:+document.getElementById(`r${i}_${j}`).value||0,completed:document.getElementById(`c${i}_${j}`).checked})),notes:document.getElementById('n'+i).value}));db.history.push({session:db.session,date:new Date().toISOString(),day:day(db.session).name,lifts});db.session++;save();renderAll()}function renderHistory(){let h='<h2>History</h2>';[...db.history].reverse().forEach(x=>{h+=`<div class="card"><h3>Session ${x.session+1} · ${esc(x.day)}</h3><div class="tiny">${new Date(x.date).toLocaleString()}</div>${x.lifts.map(l=>`<p><b>${esc(l.name)}</b><br><span class="tiny">${l.sets.map((s,i)=>`Set ${i+1}: ${s.actualWeight}×${s.actualReps}${s.completed?' ✓':''}`).join(' · ')}</span></p>`).join('')}</div>`});document.querySelector('#history').innerHTML=h+(db.history.length?'':'<p class="muted">No workouts logged yet.</p>')}function renderSettings(){document.querySelector('#settings').innerHTML=`<h2>Settings & data</h2><div class="card"><label>Weight rounding</label><select id="round"><option>0.5</option><option>1</option><option>2.5</option><option>5</option></select><button style="margin-top:8px" onclick="db.round=+document.getElementById('round').value;save();renderAll()">Save</button></div><div class="card"><button onclick="exportData()">Export backup</button><button class="secondary" onclick="document.getElementById('imp').click()">Import backup</button><input id="imp" type="file" accept="application/json" hidden onchange="importData(event)"></div><div class="card"><button class="danger" onclick="if(confirm('Delete all app data?')){localStorage.removeItem(K);location.reload()}">Delete all data</button></div>`;document.getElementById('round').value=db.round}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='iron-planner-backup.json';a.click()}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{db=JSON.parse(r.result);save();renderAll()}catch{alert('Invalid backup')}};r.readAsText(f)}function preset(t){if(!confirm('Replace the current programme with this preset? Export first if needed.'))return;if(t==='531')db.days=['Press','Deadlift','Bench Press','Squat'].map((n,i)=>({name:n,ex:[{id:uid(),name:n,base:[50,120,70,100][i],tm:[50,120,70,100][i],type:'531',inc:[2.5,5,2.5,5][i]}]}));if(t==='ss')db.days=[{name:'Workout A',ex:[{id:uid(),name:'Squat',base:100,tm:100,type:'ss',inc:2.5,sets:3,reps:5},{id:uid(),name:'Bench Press',base:70,tm:70,type:'ss',inc:2.5,sets:3,reps:5},{id:uid(),name:'Deadlift',base:120,tm:120,type:'ss',inc:5,sets:1,reps:5}]},{name:'Workout B',ex:[{id:uid(),name:'Squat',base:100,tm:100,type:'ss',inc:2.5,sets:3,reps:5},{id:uid(),name:'Press',base:50,tm:50,type:'ss',inc:2.5,sets:3,reps:5},{id:uid(),name:'Deadlift',base:120,tm:120,type:'ss',inc:5,sets:1,reps:5}]}];if(t==='texas')db.days=[{name:'Volume',ex:[{id:uid(),name:'Squat',base:100,tm:100,type:'texas',inc:2.5},{id:uid(),name:'Bench Press',base:70,tm:70,type:'texas',inc:2.5}]},{name:'Recovery',ex:[{id:uid(),name:'Squat',base:100,tm:100,type:'texas',inc:2.5}]},{name:'Intensity',ex:[{id:uid(),name:'Squat',base:100,tm:100,type:'texas',inc:2.5},{id:uid(),name:'Bench Press',base:70,tm:70,type:'texas',inc:2.5}]}];if(t==='hlm')db.days=[{name:'Heavy',ex:[{id:uid(),name:'Squat',base:100,tm:100,type:'hlm',inc:2.5}]},{name:'Light',ex:[{id:uid(),name:'Squat',base:100,tm:100,type:'hlm',inc:2.5}]},{name:'Medium',ex:[{id:uid(),name:'Squat',base:100,tm:100,type:'hlm',inc:2.5}]}];db.session=0;db.edits={};save();renderAll()}function closeM(){document.getElementById('modal').classList.remove('open')}function renderAll(){renderToday();renderForecast();renderProgram();renderHistory();renderSettings()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('main section').forEach(s=>s.hidden=true);document.getElementById(b.dataset.v).hidden=false;document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on')});renderAll();</script></body></html>
