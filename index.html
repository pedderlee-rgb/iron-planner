<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151515"><link rel="manifest" href="manifest.webmanifest"><title>Iron Planner</title>
<style>
:root{--bg:#101112;--card:#1b1d1f;--card2:#24272a;--text:#f2f3f4;--muted:#a7adb3;--accent:#ff5a4f;--ok:#70d394;--warn:#f1c75b;--line:#34383c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;padding:11px 13px;background:var(--accent);color:#fff;font-weight:700}button.secondary{background:var(--card2)}button.danger{background:#7c2723}button.small{padding:7px 9px;font-size:.88rem}input,select,textarea{background:#121415;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px;width:100%}textarea{min-height:70px;resize:vertical}.app{max-width:900px;margin:auto;padding-bottom:90px}header{position:sticky;top:0;z-index:5;background:rgba(16,17,18,.94);backdrop-filter:blur(10px);padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}header h1{font-size:1.05rem;margin:0}.pill{font-size:.78rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 8px}nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#090a0b;border-top:1px solid var(--line);display:flex;justify-content:center}nav button{background:none;color:var(--muted);border-radius:0;flex:1;max-width:180px;padding:12px 5px;font-size:.78rem}nav button.active{color:#fff;background:#1c1e20}main{padding:16px}.view{display:none}.view.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}.card h2,.card h3{margin:0 0 10px}.muted{color:var(--muted)}.tiny{font-size:.78rem;color:var(--muted)}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row .fit{flex:0 0 auto}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}label{display:block;font-size:.82rem;color:var(--muted);margin:9px 0 5px}.set-row{display:grid;grid-template-columns:40px 1fr 1fr 46px;gap:7px;align-items:center;margin:6px 0}.set-row input{padding:8px}.setno{color:var(--muted);text-align:center}.check{text-align:center}.notice{border-left:4px solid var(--warn);background:#24201a;padding:10px;border-radius:8px;margin:0 0 12px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.section-title>*{flex:1}.section-title button{flex:0 0 auto}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#303438;color:var(--muted);font-size:.7rem;margin:2px}.badge.override{background:#4a3d22;color:#f1c75b}details{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px}summary{cursor:pointer;font-weight:700}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.actions button{flex:1;min-width:130px}table{width:100%;border-collapse:collapse;font-size:.86rem}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}.forecast-row{cursor:pointer}.modal{position:fixed;inset:0;background:#000b;z-index:20;display:none;align-items:flex-end}.modal.open{display:flex}.modalbox{background:var(--card);width:min(900px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}.modalhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.close{background:none;font-size:1.6rem;padding:4px}.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#25282b;border:1px solid var(--line);padding:10px 14px;border-radius:10px;z-index:30;display:none}@media(max-width:600px){.grid2,.grid3{grid-template-columns:1fr}.set-row{grid-template-columns:32px 1fr 1fr 42px}table{font-size:.78rem}}
</style></head>
<body><div class="app"><header><h1>IRON PLANNER</h1><span id="headerPill" class="pill"></span></header><main>
<section id="today" class="view active"></section><section id="forecast" class="view"></section><section id="program" class="view"></section><section id="history" class="view"></section><section id="settings" class="view"></section>
</main><nav><button data-view="today" class="active">Today</button><button data-view="forecast">Forecast</button><button data-view="program">Programme</button><button data-view="history">History</button><button data-view="settings">Settings</button></nav></div>
<div id="modal" class="modal"><div id="modalBox" class="modalbox"></div></div><div id="toast" class="toast"></div>
<script>
const KEY='ironPlannerV5';const uid=()=>Math.random().toString(36).slice(2,10);const clone=o=>JSON.parse(JSON.stringify(o));const roundTo=(n,r)=>r?Math.round(n/r)*r:n;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const defaults={programName:'My Strength Programme',startDate:new Date().toISOString().slice(0,10),sessionIndex:0,settings:{unit:'kg',rounding:2.5},days:[{id:uid(),name:'Day 1',exercises:[]},{id:uid(),name:'Day 2',exercises:[]}],history:[],overrides:{},sessionEdits:{}};
function sessionKey(i){return 's'+i}function currentDay(){return db.days[db.sessionIndex%db.days.length]}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
function migrateV4(v){const out=clone(defaults);out.programName=v.name||'Imported Strength Programme';out.sessionIndex=5;out.settings={unit:'kg',rounding:Number(v.round)||0.5};out.days=[];out.history=[];out.sessionEdits={};out.overrides={};(v.days||[]).forEach((d,di)=>{const nd={id:uid(),name:d.name||`Day ${di+1}`,exercises:[]};(d.ex||[]).forEach((e,ei)=>{let pr={type:e.type||'fixed'};if(e.type==='linear')pr={type:'linear',increment:e.inc||2.5,sets:e.sets||3,reps:e.reps??5};else if(e.type==='531')pr={type:'531',tmIncrement:e.inc||2.5,sets:3,rounding:out.settings.rounding,skipDeload:true};else if(e.type==='texas')pr={type:'texas',volume:e.volPct??.9,recovery:e.recoveryPct??.8,intensity:e.intPct??1,increment:e.inc||2.5,topReps:e.intensityReps||5,intensitySets:e.intensitySets||1,intensityReps:e.intensityReps||5};else if(e.type==='custom')pr={type:'custom',scheme:e.scheme||'5@100, 5@100, 5@100'};else pr={type:'fixed',weight:e.base||0,sets:e.sets||3,reps:e.reps??5};nd.exercises.push({id:uid(),name:e.name||`Exercise ${ei+1}`,kind:'main',base:Number(e.base)||0,tm:Number(e.tm||e.base)||0,progression:pr})});out.days.push(nd)});(v.history||[]).forEach(q=>out.history.push({id:uid(),date:q.date||new Date().toISOString(),sessionIndex:Number(q.session||0),day:q.day||'',lifts:(q.lifts||[]).map(l=>({exerciseId:uid(),name:l.name,planned:{},sets:(l.sets||[]).map(z=>({plannedWeight:z.plannedWeight,plannedReps:z.plannedReps,actualWeight:z.actualWeight,actualReps:z.actualReps,completed:z.completed})),notes:l.notes||''}))}));return out}
let db=JSON.parse(localStorage.getItem(KEY)||'null');if(!db){const v4=JSON.parse(localStorage.getItem('ironPlannerV4')||'null');db=v4&&v4.imported?migrateV4(v4):clone(defaults)}db.settings=db.settings||{unit:'kg',rounding:2.5};db.history=db.history||[];db.sessionEdits=db.sessionEdits||{};db.overrides=db.overrides||{};
function ensureImportedSession6(){if(!db.imported)return;db.programName='Imported Strength Programme';db.sessionIndex=5;const put=(day,name,patch)=>{const e=db.days[day]?.exercises.find(x=>x.name===name);if(!e)return;const sk=sessionKey(5);db.sessionEdits[sk]=db.sessionEdits[sk]||{exercises:[]};const a=db.sessionEdits[sk].exercises;const old=a.find(x=>x.id===e.id);if(old)old.patch=patch;else a.push({id:e.id,patch})};put(1,'Box Squat',{weight:143.5,sets:1,reps:'5+',label:'Imported Session 6'});put(1,'Overhead Press',{weight:61,sets:5,reps:5,label:'Imported Session 6'});put(1,'Deadlift',{weight:207.5,sets:2,reps:3,label:'Imported Session 6'});db.imported=false;save()}ensureImportedSession6();
function occurrenceIndex(sessionIndex,dayIndex){let c=0;for(let i=0;i<sessionIndex;i++)if(i%db.days.length===dayIndex)c++;return c}
function prescription(ex,sessionIndex,dayIndex){const p=ex.progression||{type:'fixed',weight:ex.base,sets:3,reps:5};const n=occurrenceIndex(sessionIndex,dayIndex);let weight=Number(ex.base||0),sets=Number(p.sets||1),reps=p.reps??5,label='Custom',meta={};if(p.type==='fixed'){weight=Number(p.weight??ex.base);label='Fixed'}else if(p.type==='linear'){weight=Number(ex.base||0)+Number(p.increment||0)*n;sets=Number(p.sets||3);reps=p.reps??5;label='Linear'}else if(p.type==='ss'){weight=Number(ex.base||0)+Number(p.increment||0)*n;sets=Number(p.sets||3);reps=Number(p.stage||5);label='Starting Strength'}else if(p.type==='531'){const cycle=Math.floor(n/3),week=(n%3)+1,tm=Number(ex.tm||ex.base||0)+Number(p.tmIncrement||0)*cycle;const pct=week===1?[.65,.75,.85]:week===2?[.70,.80,.90]:[.75,.85,.95],rr=week===1?[5,5,'5+']:week===2?[3,3,'3+']:[5,3,'1+'];meta={percentages:pct,week,cycle:cycle+1,tm};sets=3;reps=rr;weight=pct.map(x=>roundTo(tm*x,p.rounding||db.settings.rounding));label=`5/3/1 W${week}`}else if(p.type==='texas'){const slot=n%3,week=Math.floor(n/3),f=[Number(p.volume??.9),Number(p.recovery??.8),Number(p.intensity??1)];weight=Number(ex.tm||ex.base||0)*f[slot]+Number(p.increment||0)*week;sets=slot===0?5:slot===1?3:Number(p.intensitySets||1);reps=slot===2?(p.intensityReps??p.topReps??5):5;label=['Texas Volume','Texas Recovery','Texas Intensity'][slot]}else if(p.type==='hlm'){const slot=n%3,week=Math.floor(n/3),f=[Number(p.heavy??1),Number(p.light??.8),Number(p.medium??.9)];weight=Number(ex.tm||ex.base||0)*f[slot]+Number(p.increment||0)*week;sets=Number(p.sets||3);reps=p.reps??5;label=['Heavy','Light','Medium'][slot]}else if(p.type==='custom'){const a=(p.scheme||'').split(',').map(x=>x.trim().match(/(\d+)\s*@\s*([\d.]+)/)).filter(Boolean);if(a.length){weight=a.map(m=>roundTo(Number(ex.tm||ex.base||0)*Number(m[2])/100,db.settings.rounding));reps=a.map(m=>m[1]);sets=a.length}else{weight=Number(p.weight??ex.base);sets=Number(p.sets||1);reps=p.reps??5}label='Custom'}if(!Array.isArray(weight))weight=roundTo(weight,db.settings.rounding);return{weight,sets,reps,label,meta}}
function getPlan(i){const di=i%db.days.length,d=db.days[di];const plan=d.exercises.map(ex=>({ex,...prescription(ex,i,di)}));const sk=sessionKey(i);(db.sessionEdits[sk]?.exercises||[]).forEach(ed=>{const item=plan.find(x=>x.ex.id===ed.id);if(item)Object.assign(item,ed.patch)});return{day:d,plan}}
function plannedSets(item){return Array.isArray(item.reps)?item.reps.map((r,j)=>({weight:item.weight[j],reps:r})):Array.from({length:Number(item.sets)||1},()=>({weight:item.weight,reps:item.reps}))}
function fmtWeight(w){return Number.isInteger(Number(w))?String(w):String(Number(w).toFixed(2).replace(/0+$/,'').replace(/\.$/,''))}
function renderToday(){const v=document.getElementById('today'),{day,plan}=getPlan(db.sessionIndex);document.getElementById('headerPill').textContent=`Session ${db.sessionIndex+1} · ${day.name}`;let h=db.sessionIndex===5?`<div class="notice"><b>Session 6 imported from your old app.</b> This is only the starting prescription; you can edit every lift here or change the underlying programme in Programme. Warm-ups are not included.</div>`:'';h+=`<div class="section-title"><div><h2 style="margin:0">${esc(day.name)}</h2><div class="muted">Session ${db.sessionIndex+1}</div></div><button class="secondary small" onclick="editSession(${db.sessionIndex})">Edit session</button></div>`;plan.forEach((it,idx)=>{const sets=plannedSets(it);h+=`<div class="card"><div class="row"><div><div style="font-size:1.05rem;font-weight:700">${esc(it.ex.name)}</div><span class="badge">${esc(it.label)}</span></div><div class="tiny">${esc(it.ex.kind||'main')}</div></div>`;h+=`<div class="notice" style="margin-top:9px">Planned: <b>${sets.map(s=>`${fmtWeight(s.weight)} kg × ${s.reps}`).join(' · ')}</b></div>`;h+=sets.map((s,j)=>`<div class="set-row"><div class="setno">${j+1}</div><input id="aw-${idx}-${j}" type="number" step="0.5" value="${s.weight}"><input id="ar-${idx}-${j}" type="text" value="${s.reps}"><div class="check"><input id="ac-${idx}-${j}" type="checkbox"></div></div>`).join('');h+=`<div class="tiny">Actual weight · actual reps · completed</div><label>Notes</label><textarea id="note-${idx}" placeholder="Optional"></textarea></div>`});h+=`<div class="actions"><button onclick="logSession()">Log workout & continue</button></div>`;v.innerHTML=h}
function renderForecast(){const v=document.getElementById('forecast');let h=`<div class="section-title"><div><h2 style="margin:0">Next 20 sessions</h2><div class="muted">Each lift follows its own programmed progression. Tap a row to edit that future session only.</div></div></div><div class="notice">The Forecast is a projection of the programme settings. It is not allowed to rewrite your programme from logged results.</div><div class="card"><table><thead><tr><th>#</th><th>Day</th><th>Exercise</th><th>Prescription</th></tr></thead><tbody>`;for(let i=db.sessionIndex;i<db.sessionIndex+20;i++){const p=getPlan(i);p.plan.forEach(it=>{const sets=plannedSets(it),edited=db.sessionEdits[sessionKey(i)]?.exercises?.some(e=>e.id===it.ex.id);h+=`<tr class="forecast-row" onclick="editSession(${i})"><td>${i+1}</td><td>${esc(p.day.name)}</td><td>${esc(it.ex.name)}</td><td>${sets.map(s=>`${fmtWeight(s.weight)}×${s.reps}`).join(' · ')} ${edited?'<span class="badge override">edited</span>':''}</td></tr>`})}h+=`</tbody></table></div><div class="tiny">To change the rule for a lift, use Programme. To change only one future workout, tap that forecast row.</div>`;v.innerHTML=h}
function progressionParams(p){const t=p.type||'custom';if(t==='fixed')return `<div class="grid3"><div><label>Weight</label><input data-p="weight" type="number" step="0.5" value="${p.weight??''}"></div><div><label>Sets</label><input data-p="sets" type="number" value="${p.sets??3}"></div><div><label>Reps</label><input data-p="reps" value="${p.reps??5}"></div></div>`;if(t==='custom')return `<div><label>Scheme</label><input data-p="scheme" value="${esc(p.scheme??'5@100, 5@100, 5@100')}"><div class="tiny">Example: 5@100, 5@100, 5@100</div></div>`;if(t==='linear')return `<div class="grid3"><div><label>Increment/session</label><input data-p="increment" type="number" step="0.5" value="${p.increment??2.5}"></div><div><label>Sets</label><input data-p="sets" type="number" value="${p.sets??3}"></div><div><label>Reps</label><input data-p="reps" value="${p.reps??5}"></div></div>`;if(t==='ss')return `<div class="grid3"><div><label>Stage</label><select data-p="stage"><option value="5" ${p.stage==5?'selected':''}>5</option><option value="3" ${p.stage==3?'selected':''}>3</option><option value="1" ${p.stage==1?'selected':''}>1</option></select></div><div><label>Increment/session</label><input data-p="increment" type="number" step="0.5" value="${p.increment??2.5}"></div><div><label>Sets</label><input data-p="sets" type="number" value="${p.sets??3}"></div></div>`;if(t==='531')return `<div class="grid3"><div><label>TM increment/cycle</label><input data-p="tmIncrement" type="number" step="0.5" value="${p.tmIncrement??2.5}"></div><div><label>Rounding</label><input data-p="rounding" type="number" step="0.5" value="${p.rounding??db.settings.rounding}"></div><div><label>Sets</label><input data-p="sets" type="number" value="${p.sets??3}"></div></div><label><input data-p="skipDeload" type="checkbox" ${p.skipDeload?'checked':''}> Skip deload weeks</label><div class="tiny">5/3/1 percentages: 65/75/85, 70/80/90, 75/85/95.</div>`;if(t==='texas')return `<div class="grid3"><div><label>Volume %</label><input data-p="volume" type="number" step=".01" value="${p.volume??.9}"></div><div><label>Recovery %</label><input data-p="recovery" type="number" step=".01" value="${p.recovery??.8}"></div><div><label>Intensity %</label><input data-p="intensity" type="number" step=".01" value="${p.intensity??1}"></div></div><div class="grid3"><div><label>Weekly increase</label><input data-p="increment" type="number" step="0.5" value="${p.increment??2.5}"></div><div><label>Intensity sets</label><input data-p="intensitySets" type="number" value="${p.intensitySets??1}"></div><div><label>Intensity reps</label><input data-p="intensityReps" type="number" value="${p.intensityReps??5}"></div></div>`;if(t==='hlm')return `<div class="grid3"><div><label>Heavy %</label><input data-p="heavy" type="number" step=".01" value="${p.heavy??1}"></div><div><label>Light %</label><input data-p="light" type="number" step=".01" value="${p.light??.8}"></div><div><label>Medium %</label><input data-p="medium" type="number" step=".01" value="${p.medium??.9}"></div></div><div class="grid3"><div><label>Sets</label><input data-p="sets" type="number" value="${p.sets??3}"></div><div><label>Reps</label><input data-p="reps" value="${p.reps??5}"></div><div><label>Weekly increase</label><input data-p="increment" type="number" step=".5" value="${p.increment??2.5}"></div></div>`;return ''}
function exerciseEditor(dayId,ex){const p=ex.progression||{};return `<details><summary>${esc(ex.name)} · ${esc(p.type||'custom')}</summary><label>Exercise name</label><input id="en-${ex.id}" value="${esc(ex.name)}"><div class="grid3"><div><label>Starting/base weight</label><input id="base-${ex.id}" type="number" step="0.5" value="${ex.base}"></div><div><label>Training Max</label><input id="tm-${ex.id}" type="number" step="0.5" value="${ex.tm??ex.base}"></div><div><label>Progression</label><select id="type-${ex.id}" onchange="changeType('${dayId}','${ex.id}',this.value)">${['fixed','linear','ss','531','texas','hlm','custom'].map(x=>`<option value="${x}" ${p.type===x?'selected':''}>${x==='ss'?'Starting Strength':x==='531'?'5/3/1':x==='texas'?'Texas Method':x==='hlm'?'HLM':x[0].toUpperCase()+x.slice(1)}</option>`).join('')}</select></div></div><div id="params-${ex.id}">${progressionParams(p)}</div><div class="actions"><button onclick="saveExercise('${dayId}','${ex.id}')">Save lift</button><button class="danger secondary" onclick="removeExercise('${dayId}','${ex.id}')">Delete</button></div><div class="tiny">This lift's rule is independent. Logging actual performance never changes it automatically.</div></details>`}
function renderProgram(){const v=document.getElementById('program');let h=`<div class="section-title"><div><h2 style="margin:0">Programme</h2><div class="muted">Edit each lift independently. Add days A, B, C, D or more.</div></div><button onclick="presetMenu()">Presets</button></div><div class="card"><div class="grid2"><div><label>Programme name</label><input id="pname" value="${esc(db.programName)}"></div><div><label>Lifting days</label><input type="number" min="1" max="14" id="daycount" value="${db.days.length}" onchange="resizeDays(this.value)"></div></div><button class="secondary" style="margin-top:10px" onclick="saveProgramName()">Save name</button></div>`;db.days.forEach((d,di)=>{h+=`<div class="card"><div class="row"><h3 style="margin:0;flex:1">Day ${di+1}</h3><input id="dn-${d.id}" value="${esc(d.name)}" onchange="renameDay('${d.id}',this.value)"><button class="danger small fit" onclick="removeDay('${d.id}')">Remove</button></div><div class="actions"><button class="secondary" onclick="addExercise('${d.id}')">+ Exercise</button></div>${d.exercises.map(ex=>exerciseEditor(d.id,ex)).join('')}</div>`});v.innerHTML=h}
function renameDay(id,name){const d=db.days.find(x=>x.id===id);if(d)d.name=name.trim()||d.name;save()}
function saveProgramName(){db.programName=document.getElementById('pname').value.trim()||'Strength Programme';save();renderAll();toast('Programme saved')}
function resizeDays(n){n=Math.max(1,Math.min(14,Number(n)||1));while(db.days.length<n)db.days.push({id:uid(),name:`Day ${String.fromCharCode(65+db.days.length)}`,exercises:[]});while(db.days.length>n)db.days.pop();save();renderAll()}
function addExercise(dayId){const d=db.days.find(x=>x.id===dayId);d.exercises.push({id:uid(),name:'New Exercise',kind:'main',base:0,tm:0,progression:{type:'custom',scheme:'5@100, 5@100, 5@100'}});save();renderAll()}
function removeExercise(dayId,id){const d=db.days.find(x=>x.id===dayId);d.exercises=d.exercises.filter(e=>e.id!==id);save();renderAll()}
function removeDay(id){if(db.days.length<=1)return;if(confirm('Remove this day and its lifts?')){db.days=db.days.filter(d=>d.id!==id);db.sessionIndex=Math.min(db.sessionIndex,999999);save();renderAll()}}
function changeType(dayId,id,type){const ex=db.days.find(d=>d.id===dayId).exercises.find(e=>e.id===id);ex.progression={type};document.getElementById('params-'+id).innerHTML=progressionParams(ex.progression)}
function saveExercise(dayId,id){const ex=db.days.find(d=>d.id===dayId).exercises.find(e=>e.id===id);ex.name=document.getElementById('en-'+id).value.trim()||'Exercise';ex.base=Number(document.getElementById('base-'+id).value)||0;ex.tm=Number(document.getElementById('tm-'+id).value)||0;const type=document.getElementById('type-'+id).value;const params={type};document.querySelectorAll('#params-'+id+' [data-p]').forEach(el=>{if(el.type==='checkbox')params[el.dataset.p]=el.checked;else params[el.dataset.p]=el.tagName==='SELECT'?el.value:(el.value===''?'':Number(el.value))});if(type==='custom'){const el=document.querySelector('#params-'+id+' [data-p="scheme"]');params.scheme=el?.value||'5@100, 5@100, 5@100'}ex.progression=params;save();renderAll();toast('Lift saved')}
function editSession(i){const {day,plan}=getPlan(i);let h=`<div class="modalhead"><div><h2>Edit Session ${i+1}</h2><div class="muted">${esc(day.name)}</div></div><button class="close" onclick="closeModal()">×</button></div><div class="notice">These are session-specific overrides. They do not change Training Max or the underlying programme.</div>`;plan.forEach(it=>{h+=`<div class="card"><h3>${esc(it.ex.name)}</h3><div class="grid3"><div><label>Weight(s)</label><input id="ew-${it.ex.id}" value="${Array.isArray(it.weight)?it.weight.join(','):it.weight}"></div><div><label>Sets</label><input id="es-${it.ex.id}" value="${it.sets}"></div><div><label>Reps</label><input id="er-${it.ex.id}" value="${Array.isArray(it.reps)?it.reps.join(','):it.reps}"></div></div></div>`});h+=`<div class="actions"><button onclick="saveSessionEdits(${i})">Save session overrides</button><button class="secondary" onclick="closeModal()">Cancel</button></div>`;openModal(h)}
function saveSessionEdits(i){const plan=getPlan(i).plan,edits=[];plan.forEach(it=>{const w=document.getElementById('ew-'+it.ex.id).value.split(',').map(Number),s=Number(document.getElementById('es-'+it.ex.id).value),r0=document.getElementById('er-'+it.ex.id).value,r=r0.includes(',')?r0.split(',').map(x=>x.trim()):r0.trim();edits.push({id:it.ex.id,patch:{weight:Array.isArray(it.weight)?w:w[0],sets:s,reps:r,label:'Manual override'}})});db.sessionEdits[sessionKey(i)]={exercises:edits};save();closeModal();renderAll();toast('Session override saved')}
function logSession(){const {plan}=getPlan(db.sessionIndex),lifts=[];plan.forEach((it,idx)=>{const sets=plannedSets(it).map((s,j)=>({plannedWeight:s.weight,plannedReps:s.reps,actualWeight:Number(document.getElementById(`aw-${idx}-${j}`).value)||0,actualReps:document.getElementById(`ar-${idx}-${j}`).value,completed:document.getElementById(`ac-${idx}-${j}`).checked}));lifts.push({exerciseId:it.ex.id,name:it.ex.name,planned:{weight:it.weight,sets:it.sets,reps:it.reps},sets,notes:document.getElementById('note-'+idx).value})});db.history.push({id:uid(),date:new Date().toISOString(),sessionIndex:db.sessionIndex,day:currentDay().name,lifts});db.sessionIndex++;save();renderAll();window.scrollTo(0,0);toast('Workout logged — plan unchanged')}
function renderHistory(){const v=document.getElementById('history');let h='<h2>History</h2>';if(!db.history.length)h+='<p class="muted">No workouts logged in this version yet.</p>';db.history.slice().reverse().forEach(q=>{h+=`<div class="card"><h3>Session ${Number(q.sessionIndex)+1} · ${esc(q.day)}</h3><div class="muted">${esc(q.date||'')}</div>${(q.lifts||[]).map(l=>`<p><b>${esc(l.name)}</b><br>${(l.sets||[]).map(s=>`${fmtWeight(s.actualWeight)} kg × ${esc(s.actualReps)}${s.completed?' ✓':''}`).join(' · ')}</p>`).join('')}</div>`});v.innerHTML=h}
function renderSettings(){const v=document.getElementById('settings');v.innerHTML=`<h2>Settings</h2><div class="card"><h3>Units & rounding</h3><label>Weight unit</label><select id="unit"><option>kg</option></select><label>Rounding for calculated weights</label><select id="round"><option value="0.5">0.5 kg</option><option value="1">1 kg</option><option value="2.5">2.5 kg</option><option value="5">5 kg</option></select><button style="margin-top:10px" onclick="saveSettings()">Save settings</button></div><div class="card"><h3>Programme structure</h3><p class="muted">Every lift on every day is independently editable. You can have 1–14 days and add/remove lifts. Programme rules and one-off future session overrides are separate.</p></div><div class="card"><h3>Data safety</h3><p class="muted">Everything is stored locally in this browser. Export a JSON backup regularly. Import restores the complete programme and history.</p><div class="actions"><button onclick="exportData()">Export backup</button><button class="secondary" onclick="document.getElementById('importFile').click()">Import backup</button><input id="importFile" type="file" accept=".json" style="display:none" onchange="importData(event)"></div></div><div class="card"><h3>Reset</h3><p class="muted">This removes only Iron Planner's local data for this version.</p><button class="danger" onclick="resetApp()">Delete all data</button></div>`;document.getElementById('round').value=db.settings.rounding}
function saveSettings(){db.settings.rounding=Number(document.getElementById('round').value);save();renderAll();toast('Settings saved')}function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='iron-planner-backup.json';a.click();URL.revokeObjectURL(a.href)}function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.days||!x.history)throw 0;db=x;save();renderAll();toast('Backup imported')}catch{alert('That file does not look like an Iron Planner backup.')}};r.readAsText(f)}function resetApp(){if(confirm('Delete the entire programme and history?')){localStorage.removeItem(KEY);location.reload()}}
function presetMenu(){openModal(`<div class="modalhead"><h2>Presets</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">Loading a preset replaces the current programme, so export a backup first.</p><div class="actions"><button onclick="loadPreset('ss')">Starting Strength</button><button onclick="loadPreset('531')">5/3/1</button><button onclick="loadPreset('texas')">Texas Method</button><button onclick="loadPreset('hlm')">HLM</button></div>`)}
function lift(name,base,tm,type,extra){return{id:uid(),name,kind:'main',base,tm,progression:{type,...extra}}}function loadPreset(t){if(t==='ss')db={...db,programName:'Starting Strength',sessionIndex:0,days:[{id:uid(),name:'Workout A',exercises:[lift('Squat',100,100,'ss',{stage:5,increment:2.5,sets:3}),lift('Bench Press',70,70,'ss',{stage:5,increment:2.5,sets:3}),lift('Deadlift',120,120,'ss',{stage:5,increment:5,sets:1})]},{id:uid(),name:'Workout B',exercises:[lift('Squat',100,100,'ss',{stage:5,increment:2.5,sets:3}),lift('Press',50,50,'ss',{stage:5,increment:2.5,sets:3}),lift('Deadlift',120,120,'ss',{stage:5,increment:5,sets:1})]}]};if(t==='531')db={...db,programName:'5/3/1',sessionIndex:0,days:[{id:uid(),name:'Press',exercises:[lift('Press',50,50,'531',{tmIncrement:2.5})]},{id:uid(),name:'Deadlift',exercises:[lift('Deadlift',120,120,'531',{tmIncrement:5})]},{id:uid(),name:'Bench Press',exercises:[lift('Bench Press',70,70,'531',{tmIncrement:2.5})]},{id:uid(),name:'Squat',exercises:[lift('Squat',100,100,'531',{tmIncrement:5})]}]};if(t==='texas')db={...db,programName:'Texas Method',sessionIndex:0,days:[{id:uid(),name:'Volume',exercises:[lift('Squat',100,100,'texas',{volume:.9,recovery:.8,intensity:1,increment:2.5}),lift('Bench Press',70,70,'texas',{volume:.9,recovery:.8,intensity:1,increment:2.5})]},{id:uid(),name:'Recovery',exercises:[lift('Squat',100,100,'texas',{volume:.9,recovery:.8,intensity:1,increment:2.5})]},{id:uid(),name:'Intensity',exercises:[lift('Squat',100,100,'texas',{volume:.9,recovery:.8,intensity:1,increment:2.5}),lift('Bench Press',70,70,'texas',{volume:.9,recovery:.8,intensity:1,increment:2.5})]}]};if(t==='hlm')db={...db,programName:'HLM',sessionIndex:0,days:[{id:uid(),name:'Heavy',exercises:[lift('Squat',100,100,'hlm',{heavy:1,light:.8,medium:.9,increment:2.5}),lift('Bench Press',70,70,'hlm',{heavy:1,light:.8,medium:.9,increment:2.5})]},{id:uid(),name:'Light',exercises:[lift('Squat',100,100,'hlm',{heavy:1,light:.8,medium:.9,increment:2.5})]},{id:uid(),name:'Medium',exercises:[lift('Squat',100,100,'hlm',{heavy:1,light:.8,medium:.9,increment:2.5}),lift('Bench Press',70,70,'hlm',{heavy:1,light:.8,medium:.9,increment:2.5})]}]};db.overrides={};db.sessionEdits={};save();closeModal();renderAll();toast('Preset loaded')}
function openModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>switchView(b.dataset.view));function switchView(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===id));if(id==='today')renderToday();if(id==='forecast')renderForecast();if(id==='program')renderProgram();if(id==='history')renderHistory();if(id==='settings')renderSettings()}function renderAll(){renderToday();renderForecast();renderProgram();renderHistory();renderSettings()}if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));renderAll();
</script></body></html>
