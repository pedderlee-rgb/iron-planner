<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101112"><link rel="manifest" href="manifest.webmanifest"><title>Iron Planner</title><style>:root{--bg:#101112;--card:#1b1d1f;--line:#34383c;--text:#f2f3f4;--muted:#a7adb3;--accent:#ff5a4f;--warn:#f1c75b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}.app{max-width:900px;margin:auto;padding-bottom:78px}header{padding:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;position:sticky;top:0;background:#101112f5;z-index:4}h1{font-size:1.05rem;margin:0}main{padding:15px}.view{display:none}.view.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin:0 0 12px}.notice{border-left:4px solid var(--warn);background:#24201a;padding:10px;border-radius:8px;margin:0 0 12px}.muted,.tiny{color:var(--muted)}.tiny{font-size:.78rem}button,input,select,textarea{font:inherit}button{border:0;border-radius:9px;padding:10px 12px;background:var(--accent);color:#fff;font-weight:700}button.secondary{background:#292c2f}button.danger{background:#762823}input,select,textarea{width:100%;background:#121415;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px}textarea{min-height:60px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}label{display:block;color:var(--muted);font-size:.8rem;margin:8px 0 4px}nav{position:fixed;bottom:0;left:0;right:0;background:#090a0b;border-top:1px solid var(--line);display:flex;z-index:8}nav button{background:none;color:var(--muted);border-radius:0;flex:1;padding:12px 4px;font-size:.78rem}nav button.active{background:#1c1e20;color:#fff}table{width:100%;border-collapse:collapse;font-size:.82rem}td,th{padding:8px 5px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.forecast{cursor:pointer}.badge{display:inline-block;background:#303438;color:var(--muted);border-radius:99px;padding:3px 6px;font-size:.7rem}.edited{background:#4a3d22;color:#f1c75b}details{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:9px}summary{font-weight:700;cursor:pointer}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions button{flex:1;min-width:120px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;z-index:20}.modal.open{display:flex}.modalbox{background:var(--card);width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:15px}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="app"><header><h1>IRON PLANNER</h1><span id="pill" class="tiny"></span></header><main><section id="today" class="view active"></section><section id="forecast" class="view"></section><section id="program" class="view"></section><section id="history" class="view"></section><section id="settings" class="view"></section></main><nav><button data-v="today">Today</button><button data-v="forecast">Forecast</button><button data-v="program">Programme</button><button data-v="history">History</button><button data-v="settings">Settings</button></nav></div><div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div>
<script>
const K='ironPlannerV6',uid=()=>Math.random().toString(36).slice(2,9),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),rt=(n,r)=>Math.round(n/r)*r,copy=o=>JSON.parse(JSON.stringify(o));
function fresh(){return{programName:'My Strength Programme',sessionIndex:0,round:2.5,days:[{id:uid(),name:'Workout A',exercises:[]},{id:uid(),name:'Workout B',exercises:[]}],history:[],sessionEdits:{}}}
function migrate(v){let d=fresh();d.programName=v.name||'Imported Strength Programme';d.sessionIndex=5;d.round=Number(v.round)||.5;d.days=(v.days||[]).map(x=>({id:uid(),name:x.name||'Workout',exercises:(x.ex||[]).map(e=>({id:uid(),name:e.name,base:+e.base||0,tm:+(e.tm||e.base)||0,progression:prog(e)}))}));d.imported=true;return d}
function prog(e){if(e.type==='linear')return{type:'linear',increment:e.inc||2.5,sets:e.sets||3,reps:e.reps??5};if(e.type==='531')return{type:'531',tmIncrement:e.inc||2.5,rounding:.5,phase:0};if(e.type==='texas')return{type:'texas',volume:e.volPct??.85,recovery:.8,intensity:e.intPct??1,increment:e.inc||2.5,sets:e.intensitySets||1,reps:e.intensityReps||5};if(e.type==='custom')return{type:'custom',scheme:e.scheme||'5@100, 5@100, 5@100',increment:e.inc||2.5};return{type:'fixed',weight:e.base||0,sets:e.sets||3,reps:e.reps??5}}
let db=JSON.parse(localStorage.getItem(K)||'null');if(!db){let old=JSON.parse(localStorage.getItem('ironPlannerV5')||'null');db=old?copy(old):fresh();if(old?.programName==='Imported Strength Programme'){db.imported=true;db.sessionIndex=5}}db.sessionEdits=db.sessionEdits||{};db.history=db.history||[];db.round=db.round||2.5;
function save(){localStorage.setItem(K,JSON.stringify(db))}function key(i){return's'+i}function occ(si,di){return Math.floor((si+db.days.length-1-di)/db.days.length)+1}function day(i){return db.days[i%db.days.length]}
function calc(ex,si,di){let p=ex.progression||{type:'fixed',weight:ex.base,sets:3,reps:5},n=Math.max(0,occ(si,di)-1),w=+ex.base||0,s=p.sets||1,r=p.reps??5,label='Fixed';if(p.type==='fixed'){w=+(p.weight??ex.base);s=p.sets||1;r=p.reps??5}else if(p.type==='linear'){w=+ex.base+(p.increment||0)*n;s=p.sets||3;r=p.reps??5;label='Linear'}else if(p.type==='531'){let z=n+(p.phase||0),wk=((z%3)+3)%3,cy=Math.max(0,Math.floor(z/3)+(p.cycleOffset||0)),tm=(+ex.tm||+ex.base||0)+(p.tmIncrement||0)*cy;let P=wk===0?[.65,.75,.85]:wk===1?[.7,.8,.9]:[.75,.85,.95],R=wk===0?[5,5,'5+']:wk===1?[3,3,'3+']:[5,3,'1+'];w=P.map(x=>rt(tm*x,p.rounding||db.round));s=3;r=R;label='5/3/1 W'+(wk+1)}else if(p.type==='texas'){let z=n%3,wk=Math.floor(n/3),inc=(p.increment||0)*wk,f=z===0?p.volume??.85:z===1?p.recovery??.8:p.intensity??1;w=rt((+ex.tm||+ex.base||0)*f+inc,db.round);s=z===0?5:z===1?3:p.sets||1;r=z===2?(p.reps??5):5;label=['Texas Volume','Texas Recovery','Texas Intensity'][z]}else if(p.type==='custom'){let a=(p.scheme||'').split(',').map(x=>x.trim().match(/(\d+)\s*@\s*([\d.]+)/)).filter(Boolean);if(a.length){let inc=(p.increment||0)*n;w=a.map(x=>rt((+ex.tm||+ex.base||0)*+x[2]/100+inc,db.round));r=a.map(x=>x[1]);s=a.length}label='Custom'}return{weight:w,sets:s,reps:r,label}}
function plan(si){let di=si%db.days.length,d=day(si),a=d.exercises.map(ex=>({ex,...calc(ex,si,di)}));(db.sessionEdits[key(si)]?.exercises||[]).forEach(x=>{let q=a.find(y=>y.ex.id===x.id);if(q)Object.assign(q,x.patch)});return{d,a}}
function sets(x){return Array.isArray(x.reps)?x.reps.map((r,i)=>({w:x.weight[i],r})):Array.from({length:+x.sets||1},()=>({w:x.weight,r:x.reps}))}
function fmt(w){return Number.isInteger(+w)?String(+w):String((+w).toFixed(1))}
function seedImportedFix(){if(!db.imported)return;let b=db.days[1]?.exercises.find(e=>e.name==='Box Squat'),a=db.days[0]?.exercises.find(e=>e.name==='Box Squat');if(b){b.progression={type:'531',tmIncrement:2.5,rounding:.5,phase:1,cycleOffset:-1}}if(a){a.progression={type:'linear',increment:0,sets:3,reps:5};a.base=103.5}db.sessionIndex=5;db.sessionEdits[key(5)]={exercises:[]};let put=(ex,p)=>{if(ex)db.sessionEdits[key(5)].exercises.push({id:ex.id,patch:p})};put(b,{weight:143.5,sets:1,reps:'5+',label:'Imported Session 6'});let o=db.days[1]?.exercises.find(e=>e.name==='Overhead Press');put(o,{weight:61,sets:5,reps:5,label:'Imported Session 6'});let l=db.days[1]?.exercises.find(e=>e.name==='Deadlift');put(l,{weight:207.5,sets:2,reps:3,label:'Imported Session 6'});db.imported=false;db.importedSeedDone=true;save()}if(!db.importedSeedDone&&db.programName==='Imported Strength Programme')seedImportedFix();
function repairBoxSquatTM(){if(db.boxSquatTMRepairDone)return;let b=db.days[1]?.exercises.find(e=>e.name==='Box Squat');if(b&&b.progression?.type==='531'){b.tm=+(143.5/.85).toFixed(1);b.progression.rounding=.5;b.progression.phase=1;b.progression.cycleOffset=-1;db.boxSquatTMRepairDone=true;save()}}
function repairImportedProgramming(){if(db.importedProgrammingRepairDone)return;if(db.programName!=='Imported Strength Programme')return;let a=db.days[0],b=db.days[1];if(!a||!b)return;let squat=a.exercises.find(e=>e.name==='Box Squat');if(!squat){squat={id:uid(),name:'Box Squat',base:103.5,tm:103.5,progression:{type:'linear',increment:0,sets:3,reps:5}};a.exercises.unshift(squat)}else{squat.base=103.5;squat.progression={type:'linear',increment:0,sets:3,reps:5}}let row=a.exercises.find(e=>e.name==='Barbell Row');if(row){row.base=82.5;row.tm=82.5;row.progression={type:'custom',scheme:'5@100, 5@100, 5@100',increment:2.5}}db.importedProgrammingRepairDone=true;save()}
repairBoxSquatTM();repairImportedProgramming();
function today(){let v=document.getElementById('today'),p=plan(db.sessionIndex);document.getElementById('pill').textContent=`Session ${db.sessionIndex+1} · ${p.d.name}`;let h=db.sessionIndex===5?'<div class="notice"><b>Session 6</b> is the imported starting point. Warm-ups are not included. Programme rules and actual results are separate.</div>':'';h+=`<h2>${esc(p.d.name)} <span class="muted">· Session ${db.sessionIndex+1}</span></h2>`;p.a.forEach((x,i)=>{h+=`<div class="card"><b>${esc(x.ex.name)}</b> <span class="badge">${esc(x.label)}</span><p>Planned: <b>${sets(x).map(q=>`${fmt(q.w)} kg × ${q.r}`).join(' · ')}</b></p>${sets(x).map((q,j)=>`<div class="row"><span class="tiny">${j+1}</span><input id="aw${i}_${j}" type="number" value="${q.w}"><input id="ar${i}_${j}" value="${q.r}"><input id="ac${i}_${j}" type="checkbox"></div>`).join('')}<textarea id="an${i}" placeholder="Notes"></textarea></div>`});h+='<button onclick="log()">Log workout & continue</button>';v.innerHTML=h}
function forecast(){let v=document.getElementById('forecast'),h='<h2>Next 20 sessions</h2><div class="notice">This is generated from the independently programmed lift on each day. Tap any row to edit that future session only.</div><div class="card"><table><tr><th>#</th><th>Day</th><th>Lift</th><th>Plan</th></tr>';for(let i=db.sessionIndex;i<db.sessionIndex+20;i++){let p=plan(i);p.a.forEach(x=>{let ed=db.sessionEdits[key(i)]?.exercises?.some(z=>z.id===x.ex.id);h+=`<tr class="forecast" onclick="editSession(${i})"><td>${i+1}</td><td>${esc(p.d.name)}</td><td>${esc(x.ex.name)}</td><td>${sets(x).map(q=>`${fmt(q.w)}×${q.r}`).join(' · ')} ${ed?'<span class="badge edited">edited</span>':''}</td></tr>`})}v.innerHTML=h+'</table></div><p class="tiny">Programme changes affect future forecasts. A one-off session edit does not change the rule.</p>'}
function program(){let v=document.getElementById('program'),h='<h2>Programme</h2><div class="card"><label>Programme name</label><input id="pn" value="'+esc(db.programName)+'"><label>Number of days (1–14)</label><input id="dc" type="number" min="1" max="14" value="'+db.days.length+'"><button onclick="resize()">Save structure</button></div>';db.days.forEach((d,di)=>{h+=`<div class="card"><div class="row"><input id="dn${d.id}" value="${esc(d.name)}"><button class="secondary" onclick="addEx('${d.id}')">+ Exercise</button></div>${d.exercises.map(e=>editor(d,e)).join('')}</div>`});v.innerHTML=h}
function editor(d,e){let p=e.progression||{};return`<details><summary>${esc(e.name)} · ${p.type||'fixed'}</summary><label>Lift name</label><input id="n${e.id}" value="${esc(e.name)}"><div class="grid"><div><label>Base</label><input id="b${e.id}" type="number" step=".5" value="${e.base}"></div><div><label>Training Max</label><input id="t${e.id}" type="number" step=".5" value="${e.tm}"></div><div><label>Rule</label><select id="ty${e.id}" onchange="ptype('${d.id}','${e.id}')">${['fixed','linear','531','texas','custom'].map(x=>`<option ${p.type===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div id="pp${e.id}">${params(p)}</div><div class="actions"><button onclick="saveEx('${d.id}','${e.id}')">Save lift</button><button class="danger" onclick="delEx('${d.id}','${e.id}')">Delete</button></div></details>`}
function params(p){if(p.type==='531')return`<div class="grid"><div><label>TM increment/cycle</label><input data-p="tmIncrement" type="number" step=".5" value="${p.tmIncrement??2.5}"></div><div><label>Rounding</label><input data-p="rounding" type="number" step=".5" value="${p.rounding??2.5}"></div><div><label>Phase offset (0/1/2)</label><input data-p="phase" type="number" min="0" max="2" value="${p.phase??0}"></div></div>`;if(p.type==='linear')return`<div class="grid"><div><label>Increment/session</label><input data-p="increment" type="number" step=".5" value="${p.increment??2.5}"></div><div><label>Sets</label><input data-p="sets" value="${p.sets??3}"></div><div><label>Reps</label><input data-p="reps" value="${p.reps??5}"></div></div>`;if(p.type==='texas')return`<div class="grid"><div><label>Volume %</label><input data-p="volume" type="number" step=".01" value="${p.volume??.85}"></div><div><label>Recovery %</label><input data-p="recovery" type="number" step=".01" value="${p.recovery??.8}"></div><div><label>Intensity %</label><input data-p="intensity" type="number" step=".01" value="${p.intensity??1}"></div></div><div class="grid"><div><label>Weekly increase</label><input data-p="increment" type="number" step=".5" value="${p.increment??2.5}"></div><div><label>Intensity sets</label><input data-p="sets" value="${p.sets??1}"></div><div><label>Intensity reps</label><input data-p="reps" value="${p.reps??5}"></div></div>`;if(p.type==='custom')return`<label>Scheme</label><input data-p="scheme" value="${esc(p.scheme??'5@100, 5@100, 5@100')}"><label>Increment per occurrence</label><input data-p="increment" type="number" step=".5" value="${p.increment??0}">`;return`<div class="grid"><div><label>Weight</label><input data-p="weight" value="${p.weight??''}"></div><div><label>Sets</label><input data-p="sets" value="${p.sets??3}"></div><div><label>Reps</label><input data-p="reps" value="${p.reps??5}"></div></div>`}
function ptype(did,eid){let e=db.days.find(d=>d.id===did).exercises.find(x=>x.id===eid),t=document.getElementById('ty'+eid).value;e.progression={type:t};document.getElementById('pp'+eid).innerHTML=params(e.progression)}function saveEx(did,eid){let e=db.days.find(d=>d.id===did).exercises.find(x=>x.id===eid);e.name=document.getElementById('n'+eid).value.trim()||'Exercise';e.base=+document.getElementById('b'+eid).value||0;e.tm=+document.getElementById('t'+eid).value||e.base;let p={type:document.getElementById('ty'+eid).value};document.querySelectorAll('#pp'+eid+' [data-p]').forEach(x=>p[x.dataset.p]=x.value===''?'':x.type==='checkbox'?x.checked:(isNaN(+x.value)?x.value:+x.value));e.progression=p;save();program();forecast();today()}function addEx(did){db.days.find(d=>d.id===did).exercises.push({id:uid(),name:'New Exercise',base:0,tm:0,progression:{type:'fixed',weight:0,sets:3,reps:5}});save();program()}function delEx(did,eid){let d=db.days.find(x=>x.id===did);d.exercises=d.exercises.filter(x=>x.id!==eid);save();program()}function resize(){let n=Math.max(1,Math.min(14,+document.getElementById('dc').value||1));db.programName=document.getElementById('pn').value||db.programName;while(db.days.length<n)db.days.push({id:uid(),name:'Workout '+String.fromCharCode(65+db.days.length),exercises:[]});while(db.days.length>n)db.days.pop();save();renderAll()}
function editSession(i){let p=plan(i),h=`<div class="row"><h2>Edit Session ${i+1}</h2><button class="secondary" onclick="closeM()">Close</button></div><div class="notice">One-off override only. It does not alter the programme rule or Training Max.</div>`;p.a.forEach(x=>h+=`<div class="card"><b>${esc(x.ex.name)}</b><label>Weights (comma separated if multiple)</label><input id="ew${x.ex.id}" value="${Array.isArray(x.weight)?x.weight.join(','):x.weight}"><label>Sets</label><input id="es${x.ex.id}" value="${x.sets}"><label>Reps (comma separated if multiple)</label><input id="er${x.ex.id}" value="${Array.isArray(x.reps)?x.reps.join(','):x.reps}"></div>`);h+='<button onclick="saveSession('+i+')">Save override</button>';openM(h)}function saveSession(i){let p=plan(i),a=[];p.a.forEach(x=>{let w=document.getElementById('ew'+x.ex.id).value.split(',').map(Number),r=document.getElementById('er'+x.ex.id).value,s=+document.getElementById('es'+x.ex.id).value;a.push({id:x.ex.id,patch:{weight:Array.isArray(x.weight)?w:w[0],sets:s,reps:r.includes(',')?r.split(',').map(z=>z.trim()):r,label:'Manual override'}})});db.sessionEdits[key(i)]={exercises:a};save();closeM();renderAll()}
function log(){let p=plan(db.sessionIndex),lifts=p.a.map((x,i)=>({name:x.ex.name,sets:sets(x).map((q,j)=>({plannedWeight:q.w,plannedReps:q.r,actualWeight:+document.getElementById(`aw${i}_${j}`).value||0,actualReps:document.getElementById(`ar${i}_${j}`).value,completed:document.getElementById(`ac${i}_${j}`).checked})),notes:document.getElementById('an'+i).value}));db.history.push({date:new Date().toISOString(),sessionIndex:db.sessionIndex,day:p.d.name,lifts});db.sessionIndex++;save();renderAll()}
function history(){let v=document.getElementById('history'),h='<h2>History</h2>';db.history.slice().reverse().forEach(q=>h+=`<div class="card"><b>Session ${q.sessionIndex+1} · ${esc(q.day)}</b><div class="tiny">${esc(q.date)}</div>${q.lifts.map(l=>`<p><b>${esc(l.name)}</b><br>${l.sets.map(s=>`${fmt(s.actualWeight)}×${esc(s.actualReps)}${s.completed?' ✓':''}`).join(' · ')}</p>`).join('')}</div>`);v.innerHTML=h||'<p class="muted">No workouts logged.</p>'}
function settings(){document.getElementById('settings').innerHTML='<h2>Settings</h2><div class="card"><p class="muted">Workout data is stored locally in this browser. Export a JSON backup before changing devices or clearing site data.</p><button onclick="exp()">Export backup</button><input id="imp" type="file" accept=".json" onchange="imp(event)"></div>'}function exp(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='iron-planner-backup.json';a.click()}function imp(e){let r=new FileReader();r.onload=()=>{db=JSON.parse(r.result);save();renderAll()};r.readAsText(e.target.files[0])}
function openM(h){document.getElementById('modalbox').innerHTML=h;document.getElementById('modal').classList.add('open')}function closeM(){document.getElementById('modal').classList.remove('open')}function renderAll(){today();forecast();program();history();settings()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(b.dataset.v).classList.add('active');renderAll()});renderAll();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
