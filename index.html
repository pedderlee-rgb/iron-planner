<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151515"><link rel="manifest" href="manifest.webmanifest"><title>Iron Planner</title>
<style>
:root{--bg:#101112;--card:#1b1d1f;--card2:#25282b;--text:#f2f3f4;--muted:#a7adb3;--accent:#ff5a4f;--line:#363a3e;--warn:#f1c75b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}.app{max-width:900px;margin:auto;padding-bottom:80px}
header{position:sticky;top:0;z-index:4;background:#101112ee;border-bottom:1px solid var(--line);padding:13px 15px;display:flex;justify-content:space-between}h1{font-size:18px;margin:0}
main{padding:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}h2,h3{margin:0 0 10px}.muted,.tiny{color:var(--muted)}.tiny{font-size:12px}
button,input,select,textarea{font:inherit;border-radius:9px}input,select,textarea{width:100%;padding:9px;background:#111315;color:var(--text);border:1px solid var(--line)}button{padding:10px 12px;border:0;background:var(--accent);color:white;font-weight:700}button.secondary{background:var(--card2)}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.actions button{flex:1;min-width:130px}
.set{display:grid;grid-template-columns:35px 1fr 1fr 35px;gap:7px;align-items:center;margin:6px 0}.set span{text-align:center;color:var(--muted)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;background:#090a0b;border-top:1px solid var(--line)}nav button{flex:1;background:none;color:var(--muted);border-radius:0;font-size:12px}nav button.on{background:#1c1e20;color:white}
.badge{display:inline-block;padding:3px 7px;border-radius:99px;background:#303438;color:var(--muted);font-size:11px}.modal{position:fixed;inset:0;background:#000b;z-index:10;display:none;align-items:end}.modal.open{display:flex}.box{background:var(--card);width:min(900px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
table{width:100%;border-collapse:collapse}td,th{padding:7px 5px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.notice{border-left:4px solid var(--warn);padding:10px;background:#24201a;margin-bottom:12px}
@media(min-width:700px){nav{position:sticky;top:0;bottom:auto}nav button{border:1px solid var(--line);margin:5px;border-radius:9px}}
</style></head>
<body><div class="app"><header><h1>IRON PLANNER</h1><span id="pill" class="tiny"></span></header><main>
<section id="today"></section><section id="forecast" hidden></section><section id="program" hidden></section><section id="history" hidden></section><section id="settings" hidden></section>
</main><nav><button data-v="today" class="on">Today</button><button data-v="forecast">Forecast</button><button data-v="program">Programme</button><button data-v="history">History</button><button data-v="settings">Settings</button></nav></div>
<div id="modal" class="modal"><div id="box" class="box"></div></div>
<script>
const K='ironPlannerV4';
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const R=(n,r=2.5)=>Math.round(Number(n)/r)*r;
function seed(){return{name:'Imported Strength Programme',session:5,round:.5,days:[
{name:'Workout A',ex:[{id:'box',name:'Box Squat',type:'531',base:159.3,tm:159.3,inc:2.5},{id:'bench',name:'Bench Press',type:'texas',base:97.5,tm:97.5,inc:.5,volPct:.85,intPct:.825,intensitySets:3,intensityReps:2},{id:'row',name:'Barbell Row',type:'custom',base:82.5,tm:82.5,inc:2.5,scheme:'5@100, 5@100, 5@100'}]},
{name:'Workout B',ex:[{id:'box',name:'Box Squat',type:'531',base:159.3,tm:159.3,inc:2.5},{id:'ohp',name:'Overhead Press',type:'texas',base:67.5,tm:67.5,inc:.5,volPct:.9,intPct:.9,intensitySets:1,intensityReps:5},{id:'dl',name:'Deadlift',type:'linear',base:202.5,tm:202.5,inc:2.5,sets:2,reps:3}]}
],history:[],edits:{},imported:true,version:6}}
let db=JSON.parse(localStorage.getItem(K)||'null');
if(!db){const old=JSON.parse(localStorage.getItem('ironPlannerV3')||'null');db=old&&old.imported?old:seed()}
db.session=5;db.name='Imported Strength Programme';db.version=6;db.edits=db.edits||{};
Object.keys(db.edits).filter(k=>k.startsWith('5:')).forEach(k=>delete db.edits[k]);
function save(){localStorage.setItem(K,JSON.stringify(db));} save();
function day(n){return db.days[n%db.days.length]}
function explicit(n,e){
 if(n===5&&e.name==='Box Squat')return{weight:143.5,reps:'5+',sets:1,label:'5/3/1 · imported Session 6'};
 if(n===5&&e.name==='Overhead Press')return{weight:61,reps:5,sets:5,label:'Texas Volume · imported Session 6'};
 if(n===5&&e.name==='Deadlift')return{weight:207.5,reps:3,sets:2,label:'Linear Progression · imported Session 6'};
 if(n===5&&e.name==='Bench Press')return{weight:83,reps:5,sets:5,label:'Texas Volume'};
 if(n===5&&e.name==='Barbell Row')return{weight:82.5,reps:5,sets:3,label:'Custom Builder'};
 return null;
}
function calc(e,n){
 const z=explicit(n,e);if(z)return z;
 let p=e.type||'fixed',w=+e.base||0,sets=e.sets||3,reps=e.reps||5,label='Custom';
 if(p==='linear'){w=(+e.base||0)+(+e.inc||0)*Math.max(0,n-1);label='Linear Progression'}
 else if(p==='fixed'){w=+e.weight||w;label='Fixed'}
 else if(p==='531'){
   const k=Math.max(0,n-5),phase=(Math.floor(k/2)%3)+1,tm=+e.tm||e.base;
   const pct=phase===1?[.65,.75,.85]:phase===2?[.70,.80,.90]:[.75,.85,.95];
   const rr=phase===1?[5,5,'5+']:phase===2?[3,3,'3+']:[5,3,'1+'];
   return{weight:pct.map(x=>R(tm*x,db.round)),reps:rr,sets:3,label:`5/3/1 W${phase}`}
 } else if(p==='texas'){
   const volume=n%2===0;w=R((+e.tm||e.base)*(volume?(e.volPct??.9):(e.intPct??1)),db.round);
   sets=volume?5:(e.intensitySets||1);reps=volume?5:(e.intensityReps||5);label=volume?'Texas Volume':'Texas Intensity'
 } else if(p==='custom'){
   const a=(e.scheme||'5@100, 5@100, 5@100').split(',').map(v=>v.trim().match(/(\d+)@([\d.]+)/)).filter(Boolean);
   return{weight:a.map(m=>R((+e.tm||e.base)*(+m[2]/100),db.round)),reps:a.map(m=>+m[1]),sets:a.length,label:'Custom Builder'}
 }
 return{weight:R(w,db.round),sets,reps,label}
}
function plan(n){return day(n).ex.map(e=>{const x=calc(e,n),o=db.edits[n+':'+e.id];return o?{...x,...o,e,override:true}:{...x,e}})}
function rows(x){if(Array.isArray(x.weight))return x.weight.map((w,i)=>({w,r:x.reps[i]}));return Array.from({length:x.sets},()=>({w:x.weight,r:x.reps}))}
function fmt(x){return rows(x).map(s=>`${s.w} kg × ${s.r}`).join(' · ')}
function renderToday(){
 const n=db.session,p=plan(n);
 let h=`<div class="notice"><b>Your next gym session is Session 6.</b><br>Exact imported prescription: <b>Box Squat 143.5 kg × 5+</b>, <b>OHP 61 kg × 5 × 5</b>, <b>Deadlift 207.5 kg × 3 × 2</b>.<br><span class="muted">Warm-up sets are deliberately not included in the prescription. Actual results never rewrite the plan.</span></div>
 <div class="row"><div><h2>Session ${n+1}</h2><div class="muted">${esc(day(n).name)}</div></div><button class="secondary" onclick="edit(${n})">Edit prescriptions</button></div>`;
 p.forEach((x,i)=>{h+=`<div class="card"><div class="row"><h3>${esc(x.e.name)}</h3><span class="badge">${esc(x.label)}</span></div><div class="muted">Planned: ${fmt(x)}</div>`;
 rows(x).forEach((s,j)=>h+=`<div class="set"><span>${j+1}</span><input id="w${i}_${j}" type="number" value="${s.w}"><input id="r${i}_${j}" type="text" value="${s.r}"><input id="c${i}_${j}" type="checkbox"></div>`);
 h+=`<textarea id="n${i}" placeholder="Notes"></textarea></div>`});
 h+=`<div class="actions"><button onclick="log()">Log workout & continue</button></div>`;
 document.querySelector('#today').innerHTML=h;document.querySelector('#pill').textContent=`${db.name} · Session ${n+1}`;
}
function renderForecast(){let h='<h2>Next 20 sessions</h2><p class="muted">Warm-ups are not part of the planned prescriptions.</p><table><tr><th>#</th><th>Day</th><th>Exercise</th><th>Prescription</th></tr>';for(let n=db.session;n<db.session+20;n++)plan(n).forEach(x=>h+=`<tr><td>${n+1}</td><td>${esc(day(n).name)}</td><td>${esc(x.e.name)}</td><td>${fmt(x)}</td></tr>`);document.querySelector('#forecast').innerHTML=h+'</table>'}
function renderProgram(){let h=`<div class="row"><div><h2>Programme</h2><input id="pname" value="${esc(db.name)}"></div><button onclick="saveName()">Save</button></div><div class="card"><p class="muted">Imported Strength Programme</p><ul><li>Box Squat: 5/3/1 · TM 159.3 kg · +2.5 kg</li><li>Bench Press: Texas Method · TM 97.5 kg · +0.5 kg</li><li>Barbell Row: Custom · 82.5 kg · +2.5 kg</li><li>Overhead Press: Texas Method · TM 67.5 kg · +0.5 kg</li><li>Deadlift: Linear Progression · 202.5 kg · +2.5 kg</li></ul><p class="muted">Session-specific prescriptions can be edited without rewriting future planned sessions.</p></div>`;document.querySelector('#program').innerHTML=h}
function renderHistory(){let h='<h2>History</h2>';if(!db.history?.length)h+='<p class="muted">No workouts logged in the new app yet.</p>';else db.history.slice().reverse().forEach(q=>h+=`<div class="card"><h3>Session ${q.session+1} · ${esc(q.day)}</h3><div class="muted">${esc(q.date||'')}</div>${(q.lifts||[]).map(l=>`<p><b>${esc(l.name)}</b><br>${(l.sets||[]).map(s=>`${s.actualWeight||s.plannedWeight} kg × ${s.actualReps||s.plannedReps}`).join(' · ')}</p>`).join('')}</div>`);document.querySelector('#history').innerHTML=h}
function renderSettings(){document.querySelector('#settings').innerHTML=`<h2>Settings</h2><div class="card"><p>Units: KG</p><p>Plan vs Reality: logging a result does not silently change the planned programme.</p><div class="actions"><button onclick="exportDB()">Export backup</button><button class="secondary" onclick="document.querySelector('#imp').click()">Import backup</button><input id="imp" type="file" accept="application/json" hidden onchange="importDB(this)"></div></div>`}
function edit(n){let h=`<h2>Edit Session ${n+1}</h2><p class="muted">Edit only this session. These changes are saved as a session override and do not rewrite your underlying programme.</p>`;plan(n).forEach((x,i)=>{h+=`<div class="card"><h3>${esc(x.e.name)}</h3><label>Prescription</label><textarea id="ed${i}" rows="3">${rows(x).map(s=>`${s.w} x ${s.r}`).join('\n')}</textarea></div>`});h+=`<div class="actions"><button onclick="saveEdit(${n})">Save session</button><button class="secondary" onclick="closeModal()">Cancel</button></div>`;document.querySelector('#box').innerHTML=h;document.querySelector('#modal').classList.add('open')}
function saveEdit(n){plan(n).forEach((x,i)=>{const lines=document.querySelector('#ed'+i).value.split(/\n+/).map(s=>s.trim()).filter(Boolean),a=lines.map(s=>{const m=s.match(/([\d.]+)\s*x\s*(\d+\+?|\+)/i);return m?{w:+m[1],r:m[2]}:null}).filter(Boolean);if(a.length)db.edits[n+':'+x.e.id]={weight:a.length===1?a[0].w:a.map(s=>s.w),reps:a.length===1?a[0].r:a.map(s=>s.r),sets:a.length,label:'Edited'};});save();closeModal();renderAll()}
function closeModal(){document.querySelector('#modal').classList.remove('open')}
function log(){const n=db.session,p=plan(n),lifts=p.map((x,i)=>({name:x.e.name,sets:rows(x).map((s,j)=>({plannedWeight:s.w,plannedReps:s.r,actualWeight:+document.querySelector('#w'+i+'_'+j).value,actualReps:document.querySelector('#r'+i+'_'+j).value,completed:document.querySelector('#c'+i+'_'+j).checked})),notes:document.querySelector('#n'+i).value}));db.history=db.history||[];db.history.push({session:n,date:new Date().toISOString().slice(0,10),day:day(n).name,lifts});db.session=n+1;save();renderAll();window.scrollTo(0,0)}
function saveName(){db.name=document.querySelector('#pname').value.trim()||'Strength Programme';save();renderAll()}
function exportDB(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='iron-planner-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importDB(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||!Array.isArray(x.days))throw new Error('Invalid backup');x.edits=x.edits||{};db=x;save();renderAll();alert('Backup imported.')}catch(e){alert('Could not import backup: '+e.message)}};r.readAsText(f)}
function renderAll(){renderToday();renderForecast();renderProgram();renderHistory();renderSettings()}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('main section').forEach(s=>s.hidden=true);document.querySelector('#'+b.dataset.v).hidden=false}));
renderAll();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
