<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151515"><link rel="manifest" href="manifest.webmanifest"><title>Iron Planner</title>
<style>:root{--bg:#101112;--card:#1b1d1f;--card2:#25282b;--text:#f2f3f4;--muted:#a7adb3;--accent:#ff5a4f;--line:#363a3e;--warn:#f1c75b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}.app{max-width:900px;margin:auto;padding-bottom:80px}header{position:sticky;top:0;z-index:4;background:#101112ee;border-bottom:1px solid var(--line);padding:13px 15px;display:flex;justify-content:space-between}h1{font-size:18px;margin:0}main{padding:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}h2,h3{margin:0 0 10px}.muted,.tiny{color:var(--muted)}.tiny{font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}label{display:block;color:var(--muted);font-size:12px;margin:8px 0 4px}input,select,textarea,button{font:inherit;border-radius:9px}input,select,textarea{width:100%;padding:9px;background:#111315;color:var(--text);border:1px solid var(--line)}button{padding:10px 12px;border:0;background:var(--accent);color:white;font-weight:700}button.secondary{background:var(--card2)}button.danger{background:#7c2723}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.actions button{flex:1;min-width:130px}.set{display:grid;grid-template-columns:35px 1fr 1fr 35px;gap:7px;align-items:center;margin:6px 0}.set span{text-align:center;color:var(--muted)}nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;background:#090a0b;border-top:1px solid var(--line)}nav button{flex:1;background:none;color:var(--muted);border-radius:0;font-size:12px}nav button.on{background:#1c1e20;color:white}.badge{display:inline-block;padding:3px 7px;border-radius:99px;background:#303438;color:var(--muted);font-size:11px;margin-right:4px}.override{background:var(--warn);color:#111}.modal{position:fixed;inset:0;background:#000b;z-index:10;display:none;align-items:end}.modal.open{display:flex}.box{background:var(--card);width:min(900px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}table{width:100%;border-collapse:collapse}td,th{padding:7px 5px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.notice{border-left:4px solid var(--warn);padding:10px;background:#24201a;margin-bottom:12px}@media(min-width:700px){nav{position:sticky;top:0;bottom:auto}nav button{border:1px solid var(--line);margin:5px;border-radius:9px}}</style></head>
<body><div class="app"><header><h1>IRON PLANNER</h1><span id="pill" class="tiny"></span></header><main><section id="today"></section><section id="forecast" hidden></section><section id="program" hidden></section><section id="history" hidden></section><section id="settings" hidden></section></main><nav><button data-v="today" class="on">Today</button><button data-v="forecast">Forecast</button><button data-v="program">Programme</button><button data-v="history">History</button><button data-v="settings">Settings</button></nav></div><div id="modal" class="modal"><div id="box" class="box"></div></div>
<script>
const K='ironPlannerV3';
const uid=()=>Math.random().toString(36).slice(2,9);
const R=(n,r=2.5)=>Math.round(n/r)*r;
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function lift(id,name,type,base,tm,inc,extra={}){return{id,name,type,base,tm,inc,...extra}}
function importedDB(){
 const ids={box:uid(),bench:uid(),row:uid(),dl:uid(),ohp:uid()};
 const days=[
  {name:'Workout A',ex:[lift(ids.box,'Box Squat','531',159.3,159.3,2.5,{cycleWeek:2,cycleAnchor:8}),lift(ids.bench,'Bench Press','texas',97.5,97.5,.5,{volPct:.85,intPct:.825,intensitySets:3,intensityReps:2}),lift(ids.row,'Barbell Row','custom',82.5,82.5,2.5,{scheme:'5@100, 5@100, 5@100'})]},
  {name:'Workout B',ex:[lift(ids.box,'Box Squat','531',159.3,159.3,2.5,{cycleWeek:2,cycleAnchor:8}),lift(ids.ohp,'Overhead Press','texas',67.5,67.5,.5,{volPct:.90,intPct:.90,intensitySets:1,intensityReps:5}),lift(ids.dl,'Deadlift','linear',202.5,202.5,2.5,{sets:1,reps:5})]}
 ];
 const H=[]; const add=(session,date,day,lifts)=>H.push({session,date,day,lifts});
 const sets=(arr)=>arr.map(([w,r,ar=r])=>({plannedWeight:w,plannedReps:r,actualWeight:w,actualReps:ar,completed:true}));
 add(0,'2026-08-22','Workout A',[{name:'Box Squat',planned:[116.5,133,150],sets:sets([[116.5,3],[133,3],[150,3,7]]),notes:''},{name:'Bench Press',planned:[97.5,97.5,97.5],sets:sets([[97.5,2],[97.5,2],[97.5,1]]),notes:''},{name:'Barbell Row',planned:[82.5,82.5,82.5],sets:sets([[82.5,5],[82.5,5],[82.5,5]]),notes:''}]);
 add(1,'2026-08-24','Workout B',[{name:'Box Squat',planned:[112.5,112.5,112.5],sets:sets([[112.5,5],[112.5,5],[112.5,5]]),notes:''},{name:'Overhead Press',planned:[61,61,61,61,61],sets:sets([[61,5],[61,5],[61,5],[61,5],[61,5]]),notes:''},{name:'Deadlift',planned:[202.5,202.5],sets:sets([[202.5,3],[202.5,3]]),notes:''}]);
 add(2,'2026-08-28','Workout A',[{name:'Box Squat',planned:[125,141.5,158],sets:sets([[125,5],[141.5,3],[158,5]]),notes:''},{name:'Bench Press',planned:[80.5,80.5,80.5,80.5,80.5],sets:sets([[80.5,5],[80.5,5],[80.5,5],[80.5,5],[80.5,8]]),notes:''},{name:'Barbell Row',planned:[85,85,85],sets:sets([[85,5],[85,5],[85,5]]),notes:''}]);
 add(3,'2026-09-02','Workout B',[{name:'Box Squat',planned:[108,108,108],sets:sets([[108,5],[108,5],[108,5]]),notes:''},{name:'Overhead Press',planned:[67.5],sets:sets([[67.5,5]]),notes:''},{name:'Deadlift',planned:[205],sets:sets([[205,5]]),notes:''}]);
 add(4,'2026-09-03','Workout A',[{name:'Box Squat',planned:[103.5,103.5,103.5],sets:sets([[103.5,5],[103.5,5],[103.5,5]]),notes:''},{name:'Bench Press',planned:[97.5,98],sets:sets([[97.5,3],[98,3]]),notes:''},{name:'Barbell Row',planned:[87.5,87.5,87.5],sets:sets([[87.5,5],[87.5,5],[87.5,5]]),notes:''}]);
 add(5,'2026-09-03','Workout B',[{name:'Box Squat',planned:[109.5,126.5,143.5],sets:sets([[109.5,5],[126.5,5],[143.5,5]]),notes:'Old app displayed 143.5 kg as 5+.'},{name:'Overhead Press',planned:[61,61,61,61,61],sets:sets([[61,5],[61,5],[61,5],[61,5],[61,5]]),notes:''},{name:'Deadlift',planned:[207.5],sets:sets([[207.5,5]]),notes:''}]);
 add(6,'2026-09-04','Workout A',[{name:'Box Squat',planned:[103.5,103.5,103.5],sets:sets([[103.5,5],[103.5,5],[103.5,5]]),notes:''},{name:'Bench Press',planned:[81,81,81,81,81],sets:sets([[81,5],[81,5],[81,5],[81,5],[81,5]]),notes:''},{name:'Barbell Row',planned:[90,90,90],sets:sets([[90,5],[90,5],[90,5]]),notes:''}]);
 add(7,'2026-09-04','Workout B',[{name:'Box Squat',planned:[118,135,152],sets:sets([[118,3],[135,3],[152,3]]),notes:'Old app displayed 152 kg as 3+.'},{name:'Overhead Press',planned:[68],sets:sets([[68,5]]),notes:''},{name:'Deadlift',planned:[210],sets:sets([[210,5]]),notes:''}]);
 return {name:'Imported Strength Programme',session:8,round:.5,days,history:H,edits:{},imported:true};
}
let db=JSON.parse(localStorage.getItem(K)||'null');
if(!db){db=importedDB();save()} else if(db.name==='My Strength Programme'&&db.history.length===0){db=importedDB();save()}
function save(){localStorage.setItem(K,JSON.stringify(db))}
function key(i,id){return i+':'+id}
function day(i){return db.days[i%db.days.length]}
function calc(e,n){
 let p=e.type||'fixed',w=+e.base||0,sets=e.sets||3,reps=e.reps||5,label='Custom',arr=null;
 if(p==='fixed'){w=+e.weight||w;label='Fixed'}
 else if(p==='linear'){w=(+e.base||0)+(+e.inc||0)*Math.max(0,n-1);label='Linear Progression'}
 else if(p==='custom'){let vals=(e.scheme||'5@100, 5@100, 5@100').split(',').map(v=>{let m=v.trim().match(/(\d+)@([\d.]+)/);return m?{r:+m[1],pct:+m[2]/100}:null}).filter(Boolean);arr=vals.map(v=>R((+e.tm||e.base)*v.pct,db.round));reps=vals.map(v=>v.r);sets=vals.length;w=arr[0]||e.base;label='Custom Builder'}
 else if(p==='531'){
   const anchor=e.cycleAnchor??0,startWeek=e.cycleWeek??1,k=n-anchor,phase=((startWeek-1+Math.max(0,k))%4+4)%4+1,c=Math.floor((startWeek-1+Math.max(0,k))/4),tm=(+e.tm||e.base)+(+e.inc||0)*c;
   const pct=phase===1?[.65,.75,.85]:phase===2?[.70,.80,.90]:phase===3?[.75,.85,.95]:[.40,.50,.60],rr=phase===1?[5,5,'5+']:phase===2?[3,3,'3+']:phase===3?[5,3,'1+']:[5,5,5];arr=pct.map(x=>R(tm*x,db.round));reps=rr;sets=3;label=`5/3/1 W${phase}`;
 }
 else if(p==='texas'){const s=n%2,pct=s===0?(e.volPct??.90):(e.intPct??1);w=R((+e.tm||e.base)*pct,db.round);sets=s===0?5:(e.intensitySets||1);reps=s===0?5:(e.intensityReps||5);label=s===0?'Texas Volume':'Texas Intensity'}
 if(!arr)w=R(w,db.round);return{weight:arr||w,sets,reps,label}
}
function plan(n){let d=day(n);return d.ex.map(e=>{let x=calc(e,n),o=db.edits[key(n,e.id)];return{...x,e,override:!!o,...(o||{})}})}
function setsFor(x){if(Array.isArray(x.weight))return x.weight.map((w,i)=>({w,r:x.reps[i]}));return Array.from({length:x.sets},()=>({w:x.weight,r:x.reps}))}
function fmtPlan(x){return Array.isArray(x.weight)?x.weight.map((w,i)=>w+' kg × '+x.reps[i]).join(' · '):x.weight+' kg × '+x.reps+' × '+x.sets}
function renderToday(){let p=plan(db.session),h=`<div class="notice"><b>Imported from your old app.</b><br>This is now Session ${db.session+1}. Historical actuals are stored separately from the plan. The old app's <b>143.5 kg × 5+</b> Box Squat is preserved in history and is not used to rewrite your future plan.</div><div class="row"><div><h2>${esc(day(db.session).name)}</h2><div class="muted">Session ${db.session+1}</div></div><button class="secondary" onclick="edit(${db.session})">Edit prescriptions</button></div>`;p.forEach((x,i)=>{h+=`<div class="card"><div class="row"><h3>${esc(x.e.name)}</h3><span class="badge ${x.override?'override':''}">${esc(x.override?'Override':x.label)}</span></div><div class="muted">Planned: ${fmtPlan(x)}</div>`;setsFor(x).forEach((s,j)=>h+=`<div class="set"><span>${j+1}</span><input id="w${i}_${j}" type="number" value="${s.w}"><input id="r${i}_${j}" type="text" value="${s.r}"><input id="c${i}_${j}" type="checkbox"></div>`);h+=`<textarea id="n${i}" placeholder="Notes"></textarea></div>`});h+=`<div class="actions"><button onclick="log()">Log workout & continue</button></div>`;document.querySelector('#today').innerHTML=h;document.querySelector('#pill').textContent=`${db.name} · ${db.session+1}`}
function renderForecast(){let h='<h2>Next 20 sessions</h2><p class="muted">Plan is generated from programme settings and session anchors. Actual logged results do not rewrite the plan.</p><table><tr><th>#</th><th>Day</th><th>Exercise</th><th>Prescription</th></tr>';for(let n=db.session;n<db.session+20;n++)plan(n).forEach(x=>h+=`<tr><td>${n+1}</td><td>${esc(day(n).name)}</td><td>${esc(x.e.name)}</td><td>${fmtPlan(x)}${x.override?' <span class="badge override">override</span>':''}</td></tr>`);document.querySelector('#forecast').innerHTML=h+'</table>'}
function renderProgram(){let h=`<div class="row"><div><h2>Programme</h2><input id="pname" value="${esc(db.name)}"></div><button onclick="saveName()">Save</button></div><div class="card"><p class="muted">Imported settings from the old app:</p><ul><li>Box Squat: 5/3/1 · TM 159.3 kg · +2.5 kg cycle · anchored at Session 8, Week 2</li><li>Bench Press: Texas Method · TM 97.5 kg · +0.5 kg</li><li>Barbell Row: Custom Builder · 82.5 kg · +2.5 kg · 5@100 × 3</li><li>Deadlift: Linear Progression · 202.5 kg · +2.5 kg</li><li>Overhead Press: Texas Method · TM 67.5 kg · +0.5 kg · 1×5 intensity</li></ul></div>`;db.days.forEach((d,di)=>{h+=`<div class="card"><h3>${esc(d.name)}</h3>`;d.ex.forEach(e=>h+=`<div class="card"><div class="row"><input id="en-${e.id}" value="${esc(e.name)}"></div><div class="grid3"><div><label>Base weight</label><input id="base-${e.id}" type="number" value="${e.base}"></div><div><label>Training Max</label><input id="tm-${e.id}" type="number" value="${e.tm??e.base}"></div><div><label>Increment</label><input id="inc-${e.id}" type="number" value="${e.inc??0}"></div></div><label>Progression</label><select id="type-${e.id}"><option value="531" ${e.type==='531'?'selected':''}>5/3/1</option><option value="texas" ${e.type==='texas'?'selected':''}>Texas Method</option><option value="linear" ${e.type==='linear'?'selected':''}>Linear Progression</option><option value="custom" ${e.type==='custom'?'selected':''}>Custom Builder</option></select><button style="margin-top:8px" onclick="saveEx(${di},'${e.id}')">Save lift</button></div>`);h+='</div>'});document.querySelector('#program').innerHTML=h}
function saveName(){db.name=document.getElementById('pname').value||'Imported Strength Programme';save();renderAll()}
function saveEx(di,id){let e=db.days[di].ex.find(x=>x.id===id);e.name=document.getElementById('en-'+id).value;e.base=+document.getElementById('base-'+id).value||0;e.tm=+document.getElementById('tm-'+id).value||e.base;e.inc=+document.getElementById('inc-'+id).value||0;e.type=document.getElementById('type-'+id).value;save();renderAll()}
function edit(n){let p=plan(n),h=`<div class="row"><h2>Edit session ${n+1}</h2><button class="secondary" onclick="closeM()">Close</button></div><p class="muted">Session-only overrides. They do not change Training Max, historical actuals, or the underlying progression.</p>`;p.forEach(x=>h+=`<div class="card"><h3>${esc(x.e.name)}</h3><label>Weight(s), comma separated</label><input id="ow-${x.e.id}" value="${Array.isArray(x.weight)?x.weight.join(','):x.weight}"><div class="grid"><div><label>Sets</label><input id="os-${x.e.id}" type="number" value="${x.sets}"></div><div><label>Reps, comma separated for 5/3/1</label><input id="or-${x.e.id}" value="${Array.isArray(x.reps)?x.reps.join(','):x.reps}"></div></div></div>`);h+=`<button onclick="saveEdit(${n})">Save session overrides</button>`;document.getElementById('box').innerHTML=h;document.getElementById('modal').classList.add('open')}
function saveEdit(n){plan(n).forEach(x=>{let w=document.getElementById('ow-'+x.e.id).value.split(',').map(Number),r0=document.getElementById('or-'+x.e.id).value,r=r0.includes(',')?r0.split(',').map(Number):r0;db.edits[key(n,x.e.id)]={weight:Array.isArray(x.weight)?w:w[0],sets:+document.getElementById('os-'+x.e.id).value,reps:r,label:'Manual override'}});save();closeM();renderAll()}
function log(){let p=plan(db.session),lifts=p.map((x,i)=>({name:x.e.name,planned:x.weight,sets:setsFor(x).map((s,j)=>({plannedWeight:s.w,plannedReps:s.r,actualWeight:+document.getElementById(`w${i}_${j}`).value||0,actualReps:parseFloat(document.getElementById(`r${i}_${j}`).value)||0,completed:document.getElementById(`c${i}_${j}`).checked})),notes:document.getElementById('n'+i).value}));db.history.push({session:db.session,date:new Date().toISOString(),day:day(db.session).name,lifts});db.session++;save();renderAll()}
function renderHistory(){let h='<h2>History</h2>';[...db.history].sort((a,b)=>b.session-a.session).forEach(x=>{h+=`<div class="card"><h3>Session ${x.session+1} · ${esc(x.day)}</h3><div class="tiny">${new Date(x.date+'T12:00:00').toLocaleDateString()}</div>${x.lifts.map(l=>`<p><b>${esc(l.name)}</b><br><span class="tiny">${l.sets.map((s,i)=>`Set ${i+1}: ${s.actualWeight}×${s.actualReps}${s.completed?' ✓':''}`).join(' · ')}</span></p>`).join('')}</div>`});document.querySelector('#history').innerHTML=h+(db.history.length?'':'<p class="muted">No workouts logged yet.</p>')}
function renderSettings(){document.querySelector('#settings').innerHTML=`<h2>Settings & data</h2><div class="card"><p class="muted">Weight rounding: ${db.round} kg. The imported programme contains 0.5 kg and 2.5 kg loads as shown in the old app.</p></div><div class="card"><button onclick="exportData()">Export backup</button><button class="secondary" onclick="document.getElementById('imp').click()">Import backup</button><input id="imp" type="file" accept="application/json" hidden onchange="importData(event)"></div><div class="card"><button class="danger" onclick="if(confirm('Delete all app data?')){localStorage.removeItem(K);location.reload()}">Delete all data</button></div>`}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='iron-planner-backup.json';a.click()}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{db=JSON.parse(r.result);save();renderAll()}catch{alert('Invalid backup')}};r.readAsText(f)}
function closeM(){document.getElementById('modal').classList.remove('open')}
function renderAll(){renderToday();renderForecast();renderProgram();renderHistory();renderSettings()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('main section').forEach(s=>s.hidden=true);document.getElementById(b.dataset.v).hidden=false;document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
renderAll();
</script></body></html>
